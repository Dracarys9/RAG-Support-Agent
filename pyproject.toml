[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-support-agent"
version = "0.1.0"
description = "A small, reliable support agent for the Aster & Row assignment"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0,<2",
    "flask>=3.0,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
